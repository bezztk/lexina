<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Persönlicher Wortschatz, Zitate und Journal" />
    <title>Lexina</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/words.js" defer></script>
    <script src="/vocabulary.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#words">Lexina</a>
      <nav aria-label="Bereiche">
        <button class="nav-button active" data-view="words">Wörter</button>
        <button class="nav-button" data-view="vocabulary">Vokabeln</button>
        <button class="nav-button" data-view="quotes">Texte</button>
        <button class="nav-button" data-view="journal">Journal</button>
        <button class="nav-button" data-view="settings">Einstellungen</button>
      </nav>
    </header>

    <main>
      <p id="message" class="message" aria-live="polite" hidden></p>

      <section id="words-view" class="view active">
        <div class="view-heading"><h1>Wörter</h1><div class="heading-actions word-heading-actions"><div class="word-search-wrap"><label class="visually-hidden" for="word-search">Wörter durchsuchen</label><input id="word-search" type="search" placeholder="Wort oder Bedeutung suchen" /></div><button class="primary" data-action="new-space" hidden>Bedeutung hinzufügen</button><button class="primary" data-action="new-word">Wort hinzufügen</button></div></div>
        <div class="word-inventory-toolbar">
          <div class="word-section-switch" role="tablist" aria-label="Wörterbereich">
            <button class="active" role="tab" aria-selected="true" data-word-section="inventory">Wörter</button>
            <button role="tab" aria-selected="false" data-word-section="meanings">Bedeutungen</button>
          </div>
          <div class="word-filters" aria-label="Wörter filtern">
            <label class="word-filter-select"><span class="visually-hidden">Status</span><select id="word-status-filter" aria-label="Nach Status filtern"><option value="">Alle Status</option><option value="draft">Entwurf</option><option value="learning">Lernen</option><option value="ready">Abgeschlossen</option></select></label>
            <label class="word-filter-select" id="word-tag-filter-wrap"><span class="visually-hidden">Tag</span><select id="word-tag-filter" aria-label="Nach Tag filtern"><option value="">Tag auswählen</option></select></label>
            <div id="word-tag-selection" class="selected-word-tag" hidden><span></span><button type="button" data-clear-word-tag aria-label="Tagfilter entfernen">×</button></div>
          </div>
        </div>
        <section id="word-overview" class="word-section-panel" aria-label="Wörter"><div id="word-list" class="grouped-word-list"></div></section>
        <section id="meaning-overview" class="word-section-panel" aria-label="Bedeutungen" hidden><div id="space-list" class="list"></div></section>
      </section>

      <dialog id="word-dialog" aria-labelledby="word-dialog-title">
        <form id="word-form" class="modal-form">
          <header class="modal-header"><h2 id="word-dialog-title">Wort bearbeiten</h2><div class="modal-header-actions"><button type="button" data-action="choose-word-space">Bedeutung hinzufügen</button><button type="button" class="icon-button danger" data-delete-word aria-label="Wort löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><button type="button" class="icon-button close-button" data-action="close-word" aria-label="Schließen">×</button></div></header>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <div class="word-primary-fields">
              <label>Wort<input name="term" required /></label>
              <label>Status<select name="status"><option value="draft">Entwurf</option><option value="learning">Lernen</option><option value="ready">Abgeschlossen</option></select></label>
            </div>
            <fieldset><legend>Tags</legend><div id="word-tags" class="tag-options"></div></fieldset>
            <label>Konkrete Bedeutung<input name="meaning" /></label>
            <label>Deutscher Beispielsatz<input name="exampleSentence" /></label>
            <fieldset class="language-section"><legend>Englisch</legend>
              <label>Übersetzung<input name="englishTranslation" /></label>
              <label>Beispielsatz<input name="englishExampleSentence" /></label>
            </fieldset>
            <p id="word-error" class="editor-error" aria-live="polite" hidden></p>
          </div>
          <footer class="form-actions modal-footer"><button type="button" data-action="close-word">Abbrechen</button><button class="primary">Speichern</button></footer>
        </form>
      </dialog>

      <dialog id="word-space-dialog" class="compact-dialog" aria-labelledby="word-space-dialog-title">
        <div class="modal-form">
          <header class="modal-header"><h2 id="word-space-dialog-title">Bedeutungsraum auswählen</h2><button type="button" class="icon-button close-button" data-action="close-word-space" aria-label="Schließen">×</button></header>
          <div class="modal-body">
            <label>Bedeutungsraum suchen<input id="word-space-search" type="search" placeholder="Bezeichnung suchen" /></label>
            <div id="word-space-options" class="space-picker-options"></div>
          </div>
          <footer class="form-actions modal-footer"><button type="button" data-action="clear-word-space">Zuordnung entfernen</button><button type="button" data-action="close-word-space">Fertig</button></footer>
        </div>
      </dialog>

      <dialog id="space-dialog" aria-labelledby="space-dialog-title">
        <form id="space-form" class="modal-form">
          <header class="modal-header"><h2 id="space-dialog-title">Bedeutung</h2><div class="modal-header-actions"><button type="button" class="icon-button danger" data-delete-space aria-label="Bedeutung löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><button type="button" class="icon-button close-button" data-action="close-space" aria-label="Schließen">×</button></div></header>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <label>Bezeichnung<input name="label" required /></label>
            <label>Erklärung<input name="explanation" /></label>
            <p id="space-error" class="editor-error" aria-live="polite" hidden></p>
          </div>
          <footer class="form-actions modal-footer"><button type="button" data-action="close-space">Abbrechen</button><button class="primary">Speichern</button></footer>
        </form>
      </dialog>

      <section id="quotes-view" class="view">
        <div class="view-heading">
          <h1>Texte</h1>
          <button class="primary" data-action="new-quote">Text hinzufügen</button>
        </div>
        <div class="text-section-switch word-section-switch" role="tablist" aria-label="Textart">
          <button class="active" role="tab" aria-selected="true" data-text-type="quote">Zitate</button>
          <button role="tab" aria-selected="false" data-text-type="poem">Gedichte</button>
        </div>
        <div id="quote-list" class="list"></div>
      </section>

      <dialog id="quote-dialog" aria-labelledby="quote-dialog-title">
        <form id="quote-form" class="modal-form">
          <header class="modal-header"><h2 id="quote-dialog-title">Zitat hinzufügen</h2><div class="modal-header-actions"><button type="button" class="icon-button danger" data-delete-quote aria-label="Text löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><button type="button" class="icon-button close-button" data-action="close-quote" aria-label="Schließen">×</button></div></header>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <label>Typ<select name="type"><option value="quote">Zitat</option><option value="poem">Gedicht</option></select></label>
            <label>Inhalt<textarea name="content" rows="4" required></textarea></label>
            <fieldset><legend>Tags</legend><div id="quote-tags" class="tag-options"></div></fieldset>
            <label>Notiz<input name="note" /></label>
          </div>
          <footer class="form-actions modal-footer"><button type="button" data-action="close-quote">Abbrechen</button><button class="primary" type="submit">Speichern</button></footer>
        </form>
      </dialog>

      <section id="journal-view" class="view">
        <div class="view-heading">
          <h1>Journal</h1>
          <div class="heading-actions journal-heading-actions"><label class="date-picker"><span class="visually-hidden">Tag</span><input id="journal-date" type="date" aria-label="Journaltag" /></label><button class="primary" data-action="new-journal">Eintrag hinzufügen</button></div>
        </div>
        <div id="journal-list" class="list timeline"></div>
      </section>

      <dialog id="journal-dialog" aria-labelledby="journal-dialog-title">
        <form id="journal-form" class="modal-form">
          <header class="modal-header"><h2 id="journal-dialog-title">Journaleintrag hinzufügen</h2><div class="modal-header-actions"><button type="button" class="icon-button danger" data-delete-journal aria-label="Journaleintrag löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><button type="button" class="icon-button close-button" data-action="close-journal" aria-label="Schließen">×</button></div></header>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <label>Zeitpunkt<input name="entryAt" type="datetime-local" required /></label>
            <fieldset><legend>Tags</legend><div id="journal-tags" class="tag-options"></div></fieldset>
            <label>Eintrag<textarea name="content" rows="5" required></textarea></label>
          </div>
          <footer class="form-actions modal-footer"><button type="button" data-action="close-journal">Abbrechen</button><button class="primary" type="submit">Speichern</button></footer>
        </form>
      </dialog>

      <section id="vocabulary-view" class="view">
        <div id="vocabulary-unit-overview">
          <div class="view-heading"><h1>Vokabeln</h1><button class="primary" data-action="new-vocabulary-unit">Unit hinzufügen</button></div>
          <div id="vocabulary-unit-list" class="vocabulary-unit-list"></div>
        </div>
        <div id="vocabulary-entry-overview" hidden>
          <div class="vocabulary-back-row"><button type="button" class="quiet-button" data-action="close-vocabulary-unit">← Alle Units</button></div>
          <div class="view-heading"><h1 id="vocabulary-unit-heading">Unit</h1><div class="heading-actions"><button data-action="edit-vocabulary-unit">Unit bearbeiten</button><button class="primary" data-action="new-vocabulary-entry">Vokabeln hinzufügen</button></div></div>
          <div id="vocabulary-entry-list" class="list vocabulary-entry-list"></div>
        </div>
      </section>

      <dialog id="vocabulary-unit-dialog" aria-labelledby="vocabulary-unit-dialog-title">
        <form id="vocabulary-unit-form" class="modal-form">
          <header class="modal-header"><h2 id="vocabulary-unit-dialog-title">Unit hinzufügen</h2><div class="modal-header-actions"><button type="button" class="icon-button danger" data-delete-vocabulary-unit aria-label="Unit löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><button type="button" class="icon-button close-button" data-action="close-vocabulary-unit-dialog" aria-label="Schließen">×</button></div></header>
          <div class="modal-body"><input type="hidden" name="id" /><label>Bezeichnung<input name="label" required /></label></div>
          <footer class="form-actions modal-footer"><button type="button" data-action="close-vocabulary-unit-dialog">Abbrechen</button><button class="primary" type="submit">Speichern</button></footer>
        </form>
      </dialog>

      <dialog id="vocabulary-entry-dialog" aria-labelledby="vocabulary-entry-dialog-title">
        <div class="modal-form">
          <header class="modal-header"><h2 id="vocabulary-entry-dialog-title">Vokabel hinzufügen</h2><div class="modal-header-actions"><button type="button" class="icon-button danger" data-delete-vocabulary-entry aria-label="Vokabel löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><button type="button" class="icon-button close-button" data-action="close-vocabulary-entry" aria-label="Schließen">×</button></div></header>
          <div id="vocabulary-mode-switch" class="word-section-switch vocabulary-mode-switch" role="tablist" aria-label="Art der Eingabe">
            <button type="button" class="active" role="tab" aria-selected="true" data-vocabulary-mode="import">JSON-Import</button>
            <button type="button" role="tab" aria-selected="false" data-vocabulary-mode="manual">Manuell</button>
          </div>
          <form id="vocabulary-import-form">
            <div class="modal-body vocabulary-import-body">
              <div class="prompt-heading"><strong>Prompt für ChatGPT</strong><button type="button" data-action="copy-vocabulary-prompt">Prompt kopieren</button></div>
              <textarea id="vocabulary-import-prompt" class="prompt-text" rows="7" readonly>Analysiere die angehängten Seiten mit englischen Vokabeln. Erstelle für jede Vokabel eine Dreiergruppe in dieser festen Reihenfolge: englisches Wort, deutsche Übersetzung, deutsche Bedeutung beziehungsweise Erklärung. Übernimm die Angaben inhaltlich aus der Vorlage und erfinde keine zusätzlichen Vokabeln. Gib ausschließlich ein gültiges JSON-Array in folgendem Format zurück: [[&quot;to achieve&quot;,&quot;erreichen&quot;,&quot;ein bestimmtes Ziel erfolgreich verwirklichen&quot;],[&quot;reliable&quot;,&quot;zuverlässig&quot;,&quot;so vertrauenswürdig, dass man sich darauf verlassen kann&quot;]]. Verwende keine Markdown-Codeblöcke und keinen erklärenden Text außerhalb des JSON.</textarea>
              <label>JSON einfügen<textarea name="json" rows="9" placeholder='[["to achieve","erreichen","ein Ziel erfolgreich verwirklichen"]]' required></textarea></label>
              <p id="vocabulary-import-error" class="editor-error" aria-live="polite" hidden></p>
            </div>
            <footer class="form-actions modal-footer"><button type="button" data-action="close-vocabulary-entry">Abbrechen</button><button class="primary" type="submit">Importieren</button></footer>
          </form>
          <form id="vocabulary-entry-form" hidden>
            <div class="modal-body">
              <input type="hidden" name="id" />
              <label>Englisch<input name="englishTerm" required /></label>
              <label>Deutsch<input name="germanTranslation" required /></label>
              <label>Erklärung<input name="germanExplanation" /></label>
            </div>
            <footer class="form-actions modal-footer"><button type="button" data-action="close-vocabulary-entry">Abbrechen</button><button class="primary" type="submit">Speichern</button></footer>
          </form>
        </div>
      </dialog>

      <section id="settings-view" class="view">
        <div class="view-heading"><h1>Verwaltung</h1><div class="heading-actions"><button data-action="seed-data">Daten seeden</button><button class="primary" data-action="new-tag">Tag hinzufügen</button></div></div>
        <h2 class="section-title">Tags</h2>
        <div id="tag-list" class="tag-list"></div>
      </section>

      <dialog id="tag-dialog" aria-labelledby="tag-dialog-title">
        <form id="tag-form" class="modal-form">
          <header class="modal-header"><h2 id="tag-dialog-title">Tag hinzufügen</h2><button type="button" class="icon-button close-button" data-action="close-tag" aria-label="Schließen">×</button></header>
          <div class="modal-body"><label>Bezeichnung<input name="name" required /></label></div>
          <footer class="form-actions modal-footer"><button type="button" data-action="close-tag">Abbrechen</button><button class="primary" type="submit">Speichern</button></footer>
        </form>
      </dialog>
    </main>
  </body>
</html>
